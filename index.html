        .carousel-inner,

            max-width: 100%;

        }

        @media (max-width: 576px) {
            .carousel-img {
                max-height: 250px;
            }
            .carousel {
                padding: 0 10px;
            }
            .notice-board {
                margin: 10px;
            }
        }

        /* Notice Board - Consistent with about page cards */
        .notice-board {
            text-align: center;
            padding: 1.5rem;
            background: white;
            border-radius: 12px;
            margin: 30px auto;
            max-width: 600px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(0,115,230,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .notice-board:hover {
            box-shadow: 0 10px 25px rgba(0,115,230,0.1);
            transform: translateY(-2px);
        }

        .notice-board h3 {
            margin-bottom: 1rem;
            color: #212529;
            font-weight: 600;
        }

        .notice-board ul {
            padding: 0;
            list-style: none;
            margin-bottom: 0;
        }

        .notice-board li {
            margin: 12px 0;
            padding: 8px 12px;
            background: #f8f9fa;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .notice-board li:hover {
            background: #e9ecef;
        }

        .notice-board a {
            text-decoration: none;
            color: #0073e6;
            transition: color 0.2s ease;
            font-weight: 500;
        }

        .notice-board a:hover {
            color: #005bb5;
            text-decoration: underline;
        }

        /* Loading spinner */
        .spinner-border.text-primary {
            color: #0073e6 !important;
        }

        /* Footer */
        footer {
            background: white;
            border-top: 1px solid #e9ecef !important;
            margin-top: 50px !important;
        }

        footer .text-body-secondary {
            color: #6c757d !important;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #0073e6 !important;
        }

        @media (max-width: 768px) {
            footer {
                text-align: center;
                flex-direction: column;
            }

            footer .col-md-4 {
                width: 100%;
                margin-bottom: 10px;
            }

            footer ul {
                justify-content: center !important;
            }
        }

        /* Navbar Buttons */
        .navbar .btn-outline-light {
            border-width: 2px;
            transition: all 0.3s;
        }

        .navbar .btn-outline-light:hover {
            background: white;
            color: #0073e6 !important;
            border-color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255,255,255,0.2);
        }

        @media (max-width: 576px) {
            .navbar .btn {
                width: 100%;
                margin: 5px 0;
            }
        }

        /* General text optimization */
        @media (max-width: 480px) {
            body {
                font-size: 14px;
            }

            h3 {
                font-size: 1.2rem;
            }
        }

        /* Modal styling */
        .modal-header.bg-primary {
            background: #0073e6 !important;
        }

        .modal-content {
            border: none;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>

<body>

    <!-- Notice Board -->

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous">
    </script>
    
    <script>
        // Load notices dynamically
        document.addEventListener('DOMContentLoaded', function() {
            loadNotices();
            setInterval(loadNotices, 60000);
        });
        
        function loadNotices() {
            fetch('/Student_Result_Analytics/api/get_notices.php')
                .then(response => response.json())
                .then(notices => {
                    const loadingEl = document.getElementById('notice-loading');
                    const listEl = document.getElementById('notice-list');
                    const noNoticesEl = document.getElementById('no-notices');
                    const viewAllEl = document.getElementById('view-all-link');
                    const countEl = document.getElementById('notice-count');
                    
                    loadingEl.style.display = 'none';
                    
                    if (notices.length > 0) {
                        listEl.style.display = 'block';
                        viewAllEl.style.display = 'block';
                        countEl.textContent = `(${notices.length} new)`;
                        
                        let html = '';
                        notices.forEach(notice => {
                            html += `
                                <li class="mb-2 pb-2 border-bottom text-start">
                                    <i class="bi bi-megaphone text-success me-2"></i>
                                    <span class="fw-medium">${notice.message}</span>
                                    <br>
                                    <small class="text-muted ms-4">
                                        <i class="bi bi-clock me-1"></i> ${notice.date}
                                    </small>
                                </li>
                            `;
                        });
                        listEl.innerHTML = html;
                    } else {
                        noNoticesEl.style.display = 'block';
                        countEl.textContent = '(0)';
                        
                        noNoticesEl.innerHTML = `
                            <div class="text-start">
                                <div class="mb-2 pb-2 border-bottom">
                                    <i class="bi bi-calendar-event text-primary me-2"></i>
                                    <a href="#" class="text-decoration-none">Semester 3 Results Published</a>
                                    <br><small class="text-muted ms-4">15 Feb 2026</small>
                                </div>
                                <div class="mb-2 pb-2 border-bottom">
                                    <i class="bi bi-credit-card text-warning me-2"></i>
                                    <a href="#" class="text-decoration-none">Fee Payment Deadline: 25 Dec 2024</a>
                                    <br><small class="text-muted ms-4">Last date extended</small>
                                </div>
                                <div class="mb-2 pb-2 border-bottom">
                                    <i class="bi bi-calendar-check text-info me-2"></i>
                                    <a href="#" class="text-decoration-none">Final Exam Schedule Updated</a>
                                    <br><small class="text-muted ms-4">Check your dashboard</small>
                                </div>
                            </div>
                        `;
                    }
                })
                .catch(error => {
                    console.error('Error loading notices:', error);
                    document.getElementById('notice-loading').style.display = 'none';
                    document.getElementById('no-notices').style.display = 'block';
                });
        }
        
        // View All link functionality
        document.addEventListener('DOMContentLoaded', function() {
            const viewAllLink = document.getElementById('view-all-link');
            if (viewAllLink) {
                viewAllLink.addEventListener('click', function(e) {
                    e.preventDefault();
                    
                    fetch('/Student_Result_Analytics/api/get_notices.php')
                        .then(response => response.json())
                        .then(notices => {
                            let allNoticesHtml = '<ul class="list-unstyled">';
                            notices.forEach(notice => {
                                allNoticesHtml += `
                                    <li class="mb-3 pb-2 border-bottom">
                                        <i class="bi bi-megaphone text-success me-2"></i>
                                        <span class="fw-medium">${notice.message}</span>
                                        <br>
                                        <small class="text-muted ms-4">${notice.date}</small>
                                    </li>
                                `;
                            });
                            allNoticesHtml += '</ul>';
                            
                            const modalHtml = `
                                <div class="modal fade" id="allNoticesModal" tabindex="-1">
                                    <div class="modal-dialog">
                                        <div class="modal-content">
                                            <div class="modal-header bg-primary text-white">
                                                <h5 class="modal-title">
                                                    <i class="bi bi-megaphone me-2"></i>
                                                    All Notices
                                                </h5>
                                                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                            </div>
                                            <div class="modal-body">
                                                ${allNoticesHtml}
                                            </div>
                                            <div class="modal-footer">
                                                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            `;
                            
                            const existingModal = document.getElementById('allNoticesModal');
                            if (existingModal) existingModal.remove();
                            
                            document.body.insertAdjacentHTML('beforeend', modalHtml);
                            
                            const modal = new bootstrap.Modal(document.getElementById('allNoticesModal'));
                            modal.show();
                            
                            document.getElementById('allNoticesModal').addEventListener('hidden.bs.modal', function() {
                                this.remove();
                            });
                        });
                });
            }
        });
    </script>
